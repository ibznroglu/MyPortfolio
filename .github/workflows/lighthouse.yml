name: Lighthouse

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Performance and accessibility budget (desktop and mobile)
    runs-on: ubuntu-latest

    env:
      # Placeholders: the audit only needs the app to build and render.
      VITE_FIREBASE_API_KEY: ci-placeholder
      VITE_FIREBASE_AUTH_DOMAIN: ci-placeholder
      VITE_FIREBASE_DATABASE_URL: https://ci-placeholder.firebaseio.com
      VITE_FIREBASE_PROJECT_ID: ci-placeholder
      VITE_FIREBASE_STORAGE_BUCKET: ci-placeholder
      VITE_FIREBASE_MESSAGING_SENDER_ID: ci-placeholder
      VITE_FIREBASE_APP_ID: ci-placeholder
      VITE_FIREBASE_MEASUREMENT_ID: ci-placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Run Lighthouse CI (desktop)
        run: npx lhci autorun --config=lighthouserc.json

      - name: Run Lighthouse CI (mobile)
        run: npx lhci autorun --config=lighthouserc.mobile.json
